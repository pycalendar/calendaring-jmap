coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        base: auto
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
