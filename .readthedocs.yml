version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # sphinx-last-updated-by-git needs full history; RTD's default clone
      # is shallow (depth 50), so a file untouched longer than that would
      # otherwise show no last-updated date.
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
